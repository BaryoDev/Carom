<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Carom">
  <defs>
    <radialGradient id="sphere" cx="0.33" cy="0.27" r="0.9">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.42" stop-color="#F6F3EA"/>
      <stop offset="0.78" stop-color="#CDC8B7"/>
      <stop offset="1" stop-color="#7C7A6E"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE182"/>
      <stop offset="0.5" stop-color="#FFC53D"/>
      <stop offset="1" stop-color="#C9880A"/>
    </linearGradient>
    <clipPath id="ball"><circle cx="64" cy="64" r="57"/></clipPath>
  </defs>

  <circle cx="64" cy="64" r="57" fill="url(#sphere)"/>

  <!-- the stripe as a spherical zone: elliptical edges, so the ball reads tilted rather than flat -->
  <path d="M 0 42 Q 64 60 128 42 L 128 82 Q 64 100 0 82 Z" fill="url(#band)" clip-path="url(#ball)"/>

  <!-- defines the silhouette: without it the ivory caps vanish into a white listing page -->
  <circle cx="64" cy="64" r="57" fill="none" stroke="#6B6A5F" stroke-width="5" opacity="0.62"/>

  <circle cx="64" cy="71" r="21" fill="#FFFFFF"/>

  <!-- the 9 as geometry, so it never depends on a font being present -->
  <path fill="#131A22" fill-rule="evenodd" d="M63 55.2 a8.8 8.8 0 1 1 -0.01 0 Z M63 59.4 a4.6 4.6 0 1 0 0.01 0 Z"/>
  <path fill="#131A22" d="M67.6 64 L71.8 64 L71.8 87 L67.6 87 Z"/>

  <ellipse cx="43" cy="33" rx="14" ry="8.5" fill="#FFFFFF" opacity="0.8" transform="rotate(-30 43 33)"/>
</svg>
