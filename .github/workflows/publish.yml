name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.4.0)"
        required: true
        type: string
      create_tag:
        description: "Create git tag for this version?"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Run Tests
        run: dotnet test -c Release --no-build --verbosity normal

      # Packs every packable project rather than a hand-kept list. The old list named six
      # projects and missed Carom.DependencyInjection, so that package was built, tested and
      # never shipped (#33) while CI stayed green asserting a seven-package set. A set written
      # down twice drifts; derive it once.
      - name: Pack all packages
        run: |
          VERSION=${{ github.event.inputs.version }}
          dotnet pack Carom.sln -c Release -o ./dist /p:Version=$VERSION

      # The same assertion CI makes, repeated here because this is the path that actually
      # ships. A package missing from dist is a package nobody can install.
      - name: Verify the package set
        shell: bash
        run: |
          set -uo pipefail
          expected="Carom Carom.AspNetCore Carom.DependencyInjection Carom.EntityFramework Carom.Extensions Carom.Http Carom.Telemetry.OpenTelemetry"
          actual=$(find ./dist -maxdepth 1 -name '*.nupkg' ! -name '*.symbols.nupkg' -exec basename {} \; \
                   | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.nupkg$//' | sort -u)
          echo "packed:"; printf '  %s\n' $actual

          fail=0
          for want in $expected; do
            printf '%s\n' "$actual" | grep -Fxq "$want" || { echo "::error::Missing package: $want"; fail=1; }
          done
          count=$(printf '%s\n' "$actual" | grep -c . || true)
          want_count=$(printf '%s\n' $expected | grep -c .)
          if [ "$count" -ne "$want_count" ]; then
            echo "::error::Expected exactly $want_count packages, found $count."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

      - name: List packages
        run: ls -lh ./dist/*.nupkg

      - name: Push to NuGet
        run: |
          dotnet nuget push "./dist/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create Git Tag
        if: ${{ github.event.inputs.create_tag == 'true' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v${{ github.event.inputs.version }}" -m "Release v${{ github.event.inputs.version }}"
          git push origin "v${{ github.event.inputs.version }}"

      # Lists what was actually packed. The previous list was written by hand, named six
      # packages and omitted Carom.DependencyInjection, which is the same drift that kept
      # that package unpublished (#33). One derived list, not two hand-kept ones.
      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_tag == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          packages=$(find ./dist -maxdepth 1 -name '*.nupkg' ! -name '*.symbols.nupkg' -exec basename {} \; \
                     | sed -E 's/\.[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.nupkg$//' \
                     | sort -u | sed 's/^/- /')
          printf 'release notes will list:\n%s\n' "$packages"
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --notes "## Carom v$VERSION

          Published packages:
          $packages

          See [CHANGELOG.md](https://github.com/BaryoDev/Carom/blob/master/CHANGELOG.md) for details."
