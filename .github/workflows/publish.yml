name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.4.0)"
        required: true
        type: string
      create_tag:
        description: "Create git tag for this version?"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    # Dispatch from any other branch would build, test and push to NuGet. A tag push is
    # checked against master in the "Resolve version" step instead.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      contents: write
      # Lets the runner mint the OIDC token nuget.org exchanges for a short-lived key.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dispatch passes the version as an input. A tag push derives it from the tag, and only
      # accepts a commit that is on master, so a tag on a side branch cannot publish.
      - name: Resolve version
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            VERSION="${REF_NAME#v}"
            git fetch --no-tags origin master
            if ! git merge-base --is-ancestor HEAD origin/master; then
              echo "::error::Tag $REF_NAME is not on master. Publish only from a commit on master."
              exit 1
            fi
          else
            VERSION="$INPUT_VERSION"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing $VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Run Tests
        run: dotnet test -c Release --no-build --verbosity normal

      # Packs every packable project rather than a hand-kept list. The old list named six
      # projects and missed Carom.DependencyInjection, so that package was built, tested and
      # never shipped (#33) while CI stayed green asserting a seven-package set. A set written
      # down twice drifts; derive it once.
      - name: Pack all packages
        run: |
          dotnet pack Carom.sln -c Release -o ./dist "/p:Version=$VERSION"

      # The same assertion CI makes, repeated here because this is the path that actually
      # ships. A package missing from dist is a package nobody can install.
      - name: Verify the package set
        shell: bash
        run: |
          set -uo pipefail
          expected="Carom Carom.AspNetCore Carom.DependencyInjection Carom.EntityFramework Carom.Extensions Carom.Http Carom.Telemetry.OpenTelemetry"
          actual=$(scripts/packed-package-ids.sh ./dist)
          echo "packed:"; printf '  %s\n' $actual

          fail=0
          for want in $expected; do
            printf '%s\n' "$actual" | grep -Fxq "$want" || { echo "::error::Missing package: $want"; fail=1; }
          done
          count=$(printf '%s\n' "$actual" | grep -c . || true)
          want_count=$(printf '%s\n' $expected | grep -c .)
          if [ "$count" -ne "$want_count" ]; then
            echo "::error::Expected exactly $want_count packages, found $count."
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

      - name: List packages
        run: ls -lh ./dist/*.nupkg

      # Trusted publishing: no long-lived key. Getting a key publishes nothing.
      - name: Exchange OIDC token for a short-lived NuGet key
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'arnelirobles' }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::No API key returned. Check the trusted publishing policy on nuget.org." && exit 1
          fi
          dotnet nuget push "./dist/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      # A tag push already has its tag.
      - name: Create Git Tag
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_tag == 'true' }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      # Lists what was actually packed. The previous list was written by hand, named six
      # packages and omitted Carom.DependencyInjection, which is the same drift that kept
      # that package unpublished (#33). One derived list, not two hand-kept ones.
      - name: Create GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.create_tag == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          packages=$(scripts/packed-package-ids.sh ./dist | sed 's/^/- /')
          printf 'release notes will list:\n%s\n' "$packages"
          gh release create "v$VERSION" \
            --title "Release v$VERSION" \
            --notes "## Carom v$VERSION

          Published packages:
          $packages

          See [CHANGELOG.md](https://github.com/BaryoDev/Carom/blob/master/CHANGELOG.md) for details."
