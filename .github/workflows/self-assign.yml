# Let a contributor ask for an issue by commenting `/take`, and let a maintainer grant it with
# `/approve`.
#
# GitHub's UI only offers collaborators in the assignee dropdown, and the "can this user be
# assigned" API returns 404 for everyone else — so assigning an outside contributor looks impossible
# from the web interface. The REST API allows it once the person has commented on the issue, which
# this workflow uses. The `/take` comment itself satisfies that requirement.
#
# This used to assign on `/take` alone. It now waits for a maintainer, because instant self-assign
# lets one person claim the whole `good first issue` queue in a minute and leaves every one of them
# looking taken to the next person who comes along. The cost is a round trip; the benefit is that an
# assigned issue means someone actually intends to do it. See CONTRIBUTING.md.
name: Self-assign

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

# One claim at a time per issue. The job reads the assignee list and then adds to it, so two
# comments arriving together could both see it empty and both assign — leaving two people who each
# think the issue is theirs, which is the exact outcome this workflow exists to prevent.
concurrency:
  group: self-assign-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claim:
    # Issues only. This is a cheap pre-filter; the script below checks each command exactly, because
    # `startsWith` alone would also fire on `/takeover` and quietly assign someone who was arguing
    # against the idea.
    if: >
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/take') ||
       startsWith(github.event.comment.body, '.take') ||
       startsWith(github.event.comment.body, '/approve') ||
       startsWith(github.event.comment.body, '/deny'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const who = context.payload.comment.user.login;
            const body = (context.payload.comment.body || '').trim();

            const PENDING_LABEL = 'claim: awaiting approval';
            const HELP_WANTED = `https://github.com/${owner}/${repo}/issues?q=is%3Aopen+label%3A%22help+wanted%22`;
            const POLICY = `https://github.com/${owner}/${repo}/blob/master/CONTRIBUTING.md#claiming-an-issue`;

            // The first token must be exactly the command. Without this, `/takeover this is a bad
            // idea` reads as a claim and assigns the person objecting to it.
            const tokens = body.split(/\s+/);
            const command = tokens[0];
            if (!['/take', '.take', '/approve', '/deny'].includes(command)) {
              core.info(`Not a recognised command (${command}); ignoring.`);
              return;
            }

            // Association is GitHub's own answer to "does this person speak for the repo", so we do
            // not have to maintain a list of names here.
            const association = context.payload.comment.author_association;
            const isMaintainer = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association);

            const say = (b) => github.rest.issues.createComment({ owner, repo, issue_number, body: b });

            const assign = async (login) => {
              await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [login] });
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: PENDING_LABEL })
                .catch(() => { /* label may not be present; not worth failing the run over */ });
              await say(
                `Assigned to @${login} — it's yours. 🎉\n\n` +
                `No deadline, and no hard feelings if you change your mind; just say so and ` +
                `someone else can pick it up. A draft PR early is very welcome if you'd like ` +
                `eyes on the direction before polishing it.\n\n` +
                `Worth a skim before you start: the issue body has the diagnosis, and the parts ` +
                `after "What should change" are as much a part of the job as the change itself.\n\n` +
                `CLA Assistant will ask you to sign on your first pull request. It takes about ` +
                `thirty seconds and you keep copyright of your work.`
              );
            };

            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
            const current = issue.assignees.map(a => a.login);

            // ---- /approve and /deny: maintainers only -------------------------------------------
            if (command === '/approve' || command === '/deny') {
              // Silence rather than a scolding reply. Anyone can type `/approve`, and answering
              // every stray one turns the thread into an argument about who is in charge.
              if (!isMaintainer) {
                core.info(`${who} (${association}) is not a maintainer; ignoring ${command}.`);
                return;
              }

              // `/approve @someone` names the person outright. Bare `/approve` means "the last
              // person who asked", which is the common case and saves the maintainer a copy-paste.
              let target = (tokens[1] || '').replace(/^@/, '');
              if (!target) {
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner, repo, issue_number, per_page: 100,
                });
                for (let i = comments.length - 1; i >= 0; i--) {
                  const first = (comments[i].body || '').trim().split(/\s+/)[0];
                  if (first === '/take' || first === '.take') { target = comments[i].user.login; break; }
                }
              }

              if (!target) {
                await say(`No pending \`/take\` on this issue to ${command.slice(1)}. Name someone explicitly with \`${command} @user\` if you meant to.`);
                return;
              }

              if (command === '/deny') {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: PENDING_LABEL })
                  .catch(() => {});
                await say(
                  `@${target} thanks for offering — this one isn't up for grabs right now. ` +
                  `There are others going spare under [help wanted](${HELP_WANTED}).`
                );
                return;
              }

              if (current.includes(target)) {
                core.info(`${target} already assigned; nothing to do.`);
                return;
              }
              if (current.length > 0) {
                await say(`This one is already with @${current.join(', @')}. Unassign them first if you mean to hand it to @${target}.`);
                return;
              }
              await assign(target);
              return;
            }

            // ---- /take: request, pending a maintainer -------------------------------------------
            if (current.includes(who)) {
              core.info(`${who} already has it; nothing to do.`);
              return;
            }

            // Someone else is already on it. Say so rather than silently piling on — two people
            // discovering they duplicated a weekend's work is the outcome this is meant to prevent.
            if (current.length > 0) {
              await say(
                `@${who} this one is already with @${current.join(', @')}. ` +
                `Worth checking in with them before starting — they may be glad of the help, ` +
                `or it may be further along than it looks. There are other issues going spare ` +
                `under [help wanted](${HELP_WANTED}).`
              );
              return;
            }

            // Maintainers do not queue behind themselves.
            if (isMaintainer) {
              await assign(who);
              return;
            }

            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [PENDING_LABEL] })
              .catch(e => core.warning(`Could not add "${PENDING_LABEL}": ${e.message}`));
            await say(
              `Thanks @${who} — noted, and a maintainer will confirm before you start. ` +
              `That usually takes a day or two; nudge the thread if it has been a week.\n\n` +
              `Claims are approved rather than automatic ([why](${POLICY})). Nothing to do ` +
              `until then, though reading the issue in full is time well spent — the sections ` +
              `after "What should change" are part of the work.`
            );
